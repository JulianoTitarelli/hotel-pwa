<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cardápio - Hotel do Baú</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/cardapio.css">
    <link rel="stylesheet" href="css/responsivo.css">
</head>

<body>

<header class="topo">

    <button onclick="history.back()" class="voltar">
        ← Voltar
    </button>

</header>


<section class="pesquisa">

    <input 
        type="text" 
        id="buscar"
        placeholder="🔍 Pesquisar produto">

</section>


<main id="lista-produtos">

    <!-- Produtos carregados pelo JavaScript -->

</main>



<section class="carrinho">


    <div class="resumo-carrinho">

        🛒 <span id="quantidade-itens">0</span> itens

        <strong>
            R$ <span id="total-resumo">0,00</span>
        </strong>


        <button onclick="abrirCarrinho()">
            VER PEDIDO
        </button>

    </div>



    <div id="painel-carrinho" class="painel-fechado">


        <h2>
            🛒 Meu Pedido
        </h2>


        <label>
            Número do quarto:
        </label>


        <input 
            type="number" 
            id="quarto"
            placeholder="Ex: 205">



        <label>
            Observações:
        </label>


        <textarea 
            id="observacao"
            placeholder="Alguma observação?"></textarea>



        <div id="pedido">

            Nenhum item selecionado.

        </div>



        <h3>

            Total:
            R$ <span id="total">0,00</span>

        </h3>



        <button 
            class="enviar" 
            onclick="enviarPedido()">

            ENVIAR PEDIDO

        </button>



    </div>


</section>



<script src="dados/produtos.js"></script>

<script src="js/cardapio.js"></script>

<script type="module" src="js/firebase.js?v=4"></script>

<script src="js/whatsapp.js?v=4"></script>

</body>
</html>
