<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pedidos - Hotel do Baú</title>

    <link rel="stylesheet"
          href="css/pedidos.css">

</head>


<body>


<header class="topo">

    <button
        onclick="history.back()"
        class="voltar">

        ← Voltar

    </button>


    <div class="titulo">

        <h1>🧾 Pedidos Recebidos</h1>

        <p>
            Área da Recepção
        </p>

    </div>

</header>



<main class="container">


    <div class="barra-pedidos">

        <span id="contador-pedidos">
            0 pedidos
        </span>

        <button
            onclick="carregarPedidos()"
            class="botao atualizar">

            🔄 Atualizar

        </button>

    </div>


    <section id="lista-pedidos">

        <!-- Pedidos serão carregados aqui -->

    </section>


</main>



<script>


// ==========================================
// FORMATAR DINHEIRO
// ==========================================

function dinheiro(valor){

    return Number(valor).toLocaleString(
        "pt-BR",
        {
            style:"currency",
            currency:"BRL"
        }
    );

}



// ==========================================
// CARREGAR PEDIDOS
// ==========================================

function carregarPedidos(){

    const lista =
        document.getElementById("lista-pedidos");

    lista.innerHTML = "";


    const pedidos =
        JSON.parse(
            localStorage.getItem("pedidosHotel")
        ) || [];


    document.getElementById("contador-pedidos")
        .textContent =
        pedidos.length === 1
        ? "1 pedido"
        : `${pedidos.length} pedidos`;


    if(pedidos.length === 0){

        lista.innerHTML = `

            <div class="sem-pedido">

                <h2>📭 Nenhum pedido</h2>

                <p>
                    Nenhuma comanda foi recebida ainda.
                </p>

            </div>

        `;

        return;

    }


    // Mostra o mais recente primeiro

    const pedidosOrdenados =
        [...pedidos].reverse();


    pedidosOrdenados.forEach(pedido => {


        const card =
            document.createElement("article");


        card.className = "pedido-card";


        const numero =
            String(pedido.numero)
            .padStart(3,"0");


        let itensHTML = "";


        pedido.itens.forEach(item => {

            itensHTML += `

                <div class="item">

                    <div class="item-esquerda">

                        <strong>
                            ${item.quantidade}x
                            ${item.nome}
                        </strong>

                        <small>
                            ${dinheiro(item.preco)}
                            cada
                        </small>

                    </div>


                    <strong class="subtotal">

                        ${dinheiro(item.subtotal)}

                    </strong>

                </div>

            `;

        });


        card.innerHTML = `

            <div class="pedido-topo">

                <div>

                    <h2>
                        🧾 Comanda #${numero}
                    </h2>

                    <p>
                        🚪 Quarto:
                        <strong>${pedido.quarto}</strong>
                    </p>

                </div>


                <span class="status ${pedido.status || "novo"}">

                    ${
                        pedido.status === "impresso"
                        ? "🖨️ Impresso"
                        : "🟢 Novo"
                    }

                </span>

            </div>


            <p class="data-hora">

                🕒 ${pedido.dataHora || ""}

            </p>


            <div class="linha"></div>


            <h3>🍽️ Itens</h3>


            <div class="itens">

                ${itensHTML}

            </div>


            <div class="linha"></div>


            <div class="observacao">

                <strong>📝 Observações</strong>

                <p>
                    ${pedido.observacao || "Nenhuma"}
                </p>

            </div>


            <div class="linha"></div>


            <div class="total">

                <span>TOTAL</span>

                <strong>
                    ${dinheiro(pedido.total)}
                </strong>

            </div>


            <div class="acoes-pedido">

                <button
                    onclick="imprimirPedido(${pedido.numero})"
                    class="botao imprimir">

                    🖨️ Imprimir

                </button>


                <button
                    onclick="removerPedido(${pedido.numero})"
                    class="botao remover">

                    🗑️ Remover

                </button>

            </div>

        `;


        lista.appendChild(card);

    });

}



// ==========================================
// IMPRIMIR UM PEDIDO
// ==========================================

function imprimirPedido(numero){


    let pedidos =
        JSON.parse(
            localStorage.getItem("pedidosHotel")
        ) || [];


    const pedido =
        pedidos.find(
            p => Number(p.numero) === Number(numero)
        );


    if(!pedido){

        alert("Pedido não encontrado.");

        return;

    }


    const numeroFormatado =
        String(pedido.numero)
        .padStart(3,"0");


    let itensHTML = "";


    pedido.itens.forEach(item => {

        itensHTML += `

            <div class="linha-item-impressao">

                <span>
                    ${item.quantidade}x ${item.nome}
                </span>

                <span>
                    ${dinheiro(item.subtotal)}
                </span>

            </div>

        `;

    });


    const janela =
        window.open(
            "",
            "_blank",
            "width=420,height=700"
        );


    janela.document.write(`

<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Comanda #${numeroFormatado}</title>


<style>

@page{
    size:80mm auto;
    margin:3mm;
}

body{

    font-family:
    Arial,
    sans-serif;

    width:72mm;

    margin:0 auto;

    color:#000;

    font-size:13px;

}

h1{

    text-align:center;

    margin:0;

    font-size:19px;

}

h2{

    text-align:center;

    margin:5px 0;

    font-size:16px;

}

.central{

    text-align:center;

}

.separador{

    border-top:
    1px dashed #000;

    margin:10px 0;

}

.destaque{

    font-size:17px;

    font-weight:bold;

}

.linha-item-impressao{

    display:flex;

    justify-content:
    space-between;

    gap:10px;

    margin:7px 0;

}

.obs{

    white-space:
    pre-wrap;

}

.total-impressao{

    display:flex;

    justify-content:
    space-between;

    font-size:17px;

    font-weight:bold;

}

</style>

</head>


<body>


<h1>HOTEL DO BAÚ</h1>

<h2>COMANDA #${numeroFormatado}</h2>


<div class="separador"></div>


<p class="destaque">
Quarto: ${pedido.quarto}
</p>


<p>
${pedido.dataHora || ""}
</p>


<div class="separador"></div>


${itensHTML}


<div class="separador"></div>


<strong>OBSERVAÇÕES:</strong>

<p class="obs">
${pedido.observacao || "Nenhuma"}
</p>


<div class="separador"></div>


<div class="total-impressao">

<span>TOTAL</span>

<span>
${dinheiro(pedido.total)}
</span>

</div>


<div class="separador"></div>


<p class="central">
Obrigado!
</p>


<script>

window.onload = function(){

    window.print();

};

<\/script>


</body>

</html>

    `);


    janela.document.close();


    // Marca o pedido como impresso

    pedidos =
        pedidos.map(p => {

            if(
                Number(p.numero)
                ===
                Number(numero)
            ){

                return {
                    ...p,
                    status:"impresso"
                };

            }

            return p;

        });


    localStorage.setItem(
        "pedidosHotel",
        JSON.stringify(pedidos)
    );


    setTimeout(
        carregarPedidos,
        500
    );

}



// ==========================================
// REMOVER PEDIDO
// ==========================================

function removerPedido(numero){


    const confirmar =
        confirm(
            "Deseja remover esta comanda da lista?"
        );


    if(!confirmar){

        return;

    }


    let pedidos =
        JSON.parse(
            localStorage.getItem("pedidosHotel")
        ) || [];


    pedidos =
        pedidos.filter(
            p =>
            Number(p.numero)
            !==
            Number(numero)
        );


    localStorage.setItem(
        "pedidosHotel",
        JSON.stringify(pedidos)
    );


    carregarPedidos();

}



// ==========================================
// ATUALIZAR AUTOMATICAMENTE
// ==========================================

setInterval(
    carregarPedidos,
    5000
);



// ==========================================
// INICIAR
// ==========================================

document.addEventListener(
    "DOMContentLoaded",
    carregarPedidos
);


</script>


</body>

</html>
